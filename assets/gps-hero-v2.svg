<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="212" viewBox="0 0 1000 212">
<title>GPS route with dots pulsing above a three-lane road with a scooter, truck and car</title>
<style>
.grid{stroke:#8b949e;stroke-opacity:.18;stroke-width:1}
.blk{fill:#8b949e;fill-opacity:.1}
.glow{fill:none;stroke:#0969da;stroke-opacity:.12;stroke-width:7;stroke-linecap:round}
.route{fill:none;stroke:#0969da;stroke-opacity:.55;stroke-width:2;stroke-linecap:round;stroke-dasharray:5 7;animation:flow 2.4s linear infinite}
.ring{fill:#0969da;fill-opacity:.35;transform-box:fill-box;transform-origin:center;animation:breathe 2.6s ease-out infinite}
.dot{fill:#0969da;stroke:#fff;stroke-opacity:.9;stroke-width:1.5;transform-box:fill-box;transform-origin:center;animation:beat 2.6s ease-in-out infinite}
.road{fill:#8b949e;fill-opacity:.28}
.edge{stroke:#8b949e;stroke-opacity:.5;stroke-width:1.5}
.lane{stroke:#8b949e;stroke-opacity:.8;stroke-width:2.5;stroke-dasharray:22 18;animation:lane 1s linear infinite}
.scooter{animation:right 6.5s linear infinite}
.truck{animation:left 17s linear infinite}
.car{animation:right 11s linear infinite}
.bob{animation:bob .45s ease-in-out infinite alternate}
.wheel{transform-box:fill-box;transform-origin:center;animation:spin .6s linear infinite}
.ping{fill:#0969da;fill-opacity:.5;transform-box:fill-box;transform-origin:center;animation:breathe 1.6s ease-out infinite}
@keyframes breathe{0%{transform:scale(.6);opacity:.7}100%{transform:scale(4);opacity:0}}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
@keyframes flow{to{stroke-dashoffset:-24}}
@keyframes lane{to{stroke-dashoffset:-40}}
@keyframes right{from{transform:translateX(-130px)}to{transform:translateX(1060px)}}
@keyframes left{from{transform:translateX(1060px)}to{transform:translateX(-130px)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-1.5px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
