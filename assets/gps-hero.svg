<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="170" viewBox="0 0 1000 170">
<title>GPS dots and a car driving along a road</title>
<style>
.grid{stroke:#8b949e;stroke-opacity:.18;stroke-width:1}
.route{fill:none;stroke:#0969da;stroke-opacity:.35;stroke-width:1.5;stroke-dasharray:4 6;animation:flow 3s linear infinite}
.ring{fill:#0969da;fill-opacity:.35;transform-box:fill-box;transform-origin:center;animation:breathe 2.6s ease-out infinite}
.dot{fill:#0969da;transform-box:fill-box;transform-origin:center;animation:beat 2.6s ease-in-out infinite}
.road{fill:#8b949e;fill-opacity:.28}
.edge{stroke:#8b949e;stroke-opacity:.5;stroke-width:1.5}
.lane{stroke:#8b949e;stroke-opacity:.8;stroke-width:3;stroke-dasharray:22 18;animation:lane 1s linear infinite}
.car{animation:drive 11s linear infinite}
.bob{animation:bob .45s ease-in-out infinite alternate}
.wheel{transform-box:fill-box;transform-origin:center;animation:spin .6s linear infinite}
.ping{fill:#0969da;transform-box:fill-box;transform-origin:center;animation:breathe 1.6s ease-out infinite}
@keyframes breathe{0%{transform:scale(.6);opacity:.7}100%{transform:scale(4);opacity:0}}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
@keyframes flow{to{stroke-dashoffset:-20}}
@keyframes lane{to{stroke-dashoffset:-40}}
@keyframes drive{from{transform:translateX(-110px)}to{transform:translateX(1060px)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-1.5px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g><line class="grid" x1="0" y1="0" x2="0" y2="125"/><line class="grid" x1="50" y1="0" x2="50" y2="125"/><line class="grid" x1="100" y1="0" x2="100" y2="125"/><line class="grid" x1="150" y1="0" x2="150" y2="125"/><line class="grid" x1="200" y1="0" x2="200" y2="125"/><line class="grid" x1="250" y1="0" x2="250" y2="125"/><line class="grid" x1="300" y1="0" x2="300" y2="125"/><line class="grid" x1="350" y1="0" x2="350" y2="125"/><line class="grid" x1="400" y1="0" x2="400" y2="125"/><line class="grid" x1="450" y1="0" x2="450" y2="125"/><line class="grid" x1="500" y1="0" x2="500" y2="125"/><line class="grid" x1="550" y1="0" x2="550" y2="125"/><line class="grid" x1="600" y1="0" x2="600" y2="125"/><line class="grid" x1="650" y1="0" x2="650" y2="125"/><line class="grid" x1="700" y1="0" x2="700" y2="125"/><line class="grid" x1="750" y1="0" x2="750" y2="125"/><line class="grid" x1="800" y1="0" x2="800" y2="125"/><line class="grid" x1="850" y1="0" x2="850" y2="125"/><line class="grid" x1="900" y1="0" x2="900" y2="125"/><line class="grid" x1="950" y1="0" x2="950" y2="125"/><line class="grid" x1="1000" y1="0" x2="1000" y2="125"/><line class="grid" x1="0" y1="25" x2="1000" y2="25"/><line class="grid" x1="0" y1="50" x2="1000" y2="50"/><line class="grid" x1="0" y1="75" x2="1000" y2="75"/><line class="grid" x1="0" y1="100" x2="1000" y2="100"/></g>
<path class="route" d="M90,40 L210,78 L340,34 L470,70 L610,30 L740,74 L860,40 L950,80"/>
<g transform="translate(90,40)"><circle class="ring" style="animation-delay:0s" r="6"/><circle class="ring" style="animation-delay:1.2s" r="6"/><circle class="dot" style="animation-delay:0s" r="4.5"/></g>
<g transform="translate(210,78)"><circle class="ring" style="animation-delay:1.1s" r="6"/><circle class="ring" style="animation-delay:2.3s" r="6"/><circle class="dot" style="animation-delay:1.1s" r="4.5"/></g>
<g transform="translate(340,34)"><circle class="ring" style="animation-delay:0.5s" r="6"/><circle class="ring" style="animation-delay:1.7s" r="6"/><circle class="dot" style="animation-delay:0.5s" r="4.5"/></g>
<g transform="translate(470,70)"><circle class="ring" style="animation-delay:1.8s" r="6"/><circle class="ring" style="animation-delay:3.0s" r="6"/><circle class="dot" style="animation-delay:1.8s" r="4.5"/></g>
<g transform="translate(610,30)"><circle class="ring" style="animation-delay:0.9s" r="6"/><circle class="ring" style="animation-delay:2.1s" r="6"/><circle class="dot" style="animation-delay:0.9s" r="4.5"/></g>
<g transform="translate(740,74)"><circle class="ring" style="animation-delay:0.3s" r="6"/><circle class="ring" style="animation-delay:1.5s" r="6"/><circle class="dot" style="animation-delay:0.3s" r="4.5"/></g>
<g transform="translate(860,40)"><circle class="ring" style="animation-delay:1.5s" r="6"/><circle class="ring" style="animation-delay:2.7s" r="6"/><circle class="dot" style="animation-delay:1.5s" r="4.5"/></g>
<g transform="translate(950,80)"><circle class="ring" style="animation-delay:0.7s" r="6"/><circle class="ring" style="animation-delay:1.9s" r="6"/><circle class="dot" style="animation-delay:0.7s" r="4.5"/></g>
<rect class="road" x="0" y="118" width="1000" height="44"/>
<line class="edge" x1="0" y1="118" x2="1000" y2="118"/><line class="edge" x1="0" y1="162" x2="1000" y2="162"/>
<line class="lane" x1="0" y1="140" x2="1000" y2="140"/>
<g class="car"><g transform="translate(0,102)"><g class="bob">
<circle class="ping" cx="30" cy="10" r="6"/>
<path d="M2 28 L2 20 Q2 16 7 15 L18 13 L26 4 Q28 2 31 2 L47 2 Q50 2 52 4 L60 13 L70 15 Q75 16 75 21 L75 28 Z" fill="#0969da"/>
<path d="M24 13 L29 5 L38 5 L38 13 Z M42 13 L42 5 L49 5 L56 13 Z" fill="#ddf4ff"/>
<circle cx="75" cy="20" r="2.5" fill="#f7c948"/><circle cx="3" cy="20" r="2" fill="#cf222e"/>
<g><circle cx="18" cy="28" r="7" fill="#24292f"/><g class="wheel"><circle cx="18" cy="28" r="3.5" fill="#d0d7de"/><path d="M18 24.5V31.5M14.5 28H21.5" stroke="#24292f" stroke-width="1.2"/></g></g>
<g><circle cx="58" cy="28" r="7" fill="#24292f"/><g class="wheel"><circle cx="58" cy="28" r="3.5" fill="#d0d7de"/><path d="M58 24.5V31.5M54.5 28H61.5" stroke="#24292f" stroke-width="1.2"/></g></g>
</g></g></g>
</svg>