<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="190" viewBox="0 0 1000 190">
<title>Muhammad Tahir, GPS Tracking and Fleet Software Engineer</title>
<defs>
<linearGradient id="n" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0550ae"/><stop offset=".55" stop-color="#0969da"/><stop offset="1" stop-color="#54aeff"/></linearGradient>
<linearGradient id="u" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0969da" stop-opacity="0"/><stop offset=".5" stop-color="#0969da"/><stop offset="1" stop-color="#0969da" stop-opacity="0"/></linearGradient>
</defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif}
.role{fill:#24292f}.meta{fill:#57606a}
@media (prefers-color-scheme:dark){.role{fill:#e6edf3}.meta{fill:#8b949e}}
.rule{transform-box:fill-box;transform-origin:center;animation:grow 1.2s .1s ease-out backwards}
.shine{animation:shine 4.5s 1.5s ease-in-out infinite}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes shine{0%{transform:translateX(-120px);opacity:0}15%{opacity:.9}55%{transform:translateX(420px);opacity:.9}70%,100%{transform:translateX(420px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<text class="name" x="500" y="78" text-anchor="middle" font-size="60" font-weight="700" letter-spacing="1" fill="url(#n)">Muhammad Tahir</text>
<rect class="rule" x="290" y="96" width="420" height="2.5" rx="1.25" fill="url(#u)"/>
<rect class="shine" x="290" y="95.5" width="60" height="3.5" rx="1.75" fill="#fff" opacity="0"/>
<text class="role" x="500" y="132" text-anchor="middle" font-size="17" font-weight="600" letter-spacing="3.5">GPS TRACKING &amp; FLEET SOFTWARE ENGINEER</text>
<text class="meta" x="500" y="158" text-anchor="middle" font-size="15" letter-spacing=".5">Traccar Expert  ·  Swift  ·  Java  ·  Flutter  ·  Pakistan  ·  Available for freelance work</text>
</svg>
